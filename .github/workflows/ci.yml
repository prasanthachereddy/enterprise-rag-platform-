name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the CDK command line tool
        run: npm install -g aws-cdk

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cloud]"

      - name: Lint, types, tests, Lambda bundle and CDK synth
        run: python scripts/verify_all.py --with-cdk